<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1c" />
      <stop offset="100%" stop-color="#16162a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222238" stroke-width="0.8" opacity="0.4" />
  </pattern>
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- App Window Container -->
  <g transform="translate(40, 35)">
    <!-- Window Border & Shadow -->
    <rect width="720" height="410" rx="14" fill="#12121f" stroke="#29293e" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect width="720" height="44" rx="14" fill="#181829" />
    <rect y="30" width="720" height="14" fill="#181829" />
    <line x1="0" y1="44" x2="720" y2="44" stroke="#26263b" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="28" cy="22" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="48" cy="22" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="68" cy="22" r="6" fill="#10B981" opacity="0.8" />
    <text x="360" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">TypeMaster — Interactive Typing Benchmark &amp; Speed Test</text>

    <!-- Stats Bar -->
    <g transform="translate(40, 70)">
      <!-- WPM Card -->
      <rect x="0" y="0" width="180" height="74" rx="10" fill="#1a1a2e" stroke="#2f2f4a" stroke-width="1" />
      <text x="20" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">WORDS PER MINUTE</text>
      <text x="20" y="58" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#A78BFA">78 <tspan font-size="14" fill="#71717A">WPM</tspan></text>

      <!-- Accuracy Card -->
      <rect x="220" y="0" width="180" height="74" rx="10" fill="#1a1a2e" stroke="#2f2f4a" stroke-width="1" />
      <text x="240" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">ACCURACY RATE</text>
      <text x="240" y="58" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#60A5FA">98.4<tspan font-size="14" fill="#71717A">%</tspan></text>

      <!-- Timer Card -->
      <rect x="440" y="0" width="200" height="74" rx="10" fill="#1a1a2e" stroke="#2f2f4a" stroke-width="1" />
      <text x="460" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">TIME ELAPSED</text>
      <text x="460" y="58" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#34D399">00:45 <tspan font-size="14" fill="#71717A">/ 60s</tspan></text>
    </g>

    <!-- Typing Prompt Area -->
    <g transform="translate(40, 165)">
      <rect width="640" height="110" rx="10" fill="#151525" stroke="#2c2c44" stroke-width="1" />
      <!-- Typed words -->
      <text x="25" y="42" font-family="'Space Grotesk', monospace" font-size="18" fill="#10B981" font-weight="500">The quick brown fox jumps over</text>
      <text x="320" y="42" font-family="'Space Grotesk', monospace" font-size="18" fill="#F8FAFC" font-weight="600">the lazy dog.</text>
      <!-- Cursor -->
      <rect x="445" y="26" width="2.5" height="22" fill="#8B5CF6" />
      <!-- Remaining text -->
      <text x="455" y="42" font-family="'Space Grotesk', monospace" font-size="18" fill="#64748B">Continuous practice enhances cognitive coordination,</text>
      <text x="25" y="74" font-family="'Space Grotesk', monospace" font-size="18" fill="#64748B">optimizing both typing velocity and algorithmic keystroke precision.</text>
    </g>

    <!-- Virtual Keyboard Guidance Mockup -->
    <g transform="translate(40, 295)">
      <rect width="640" height="90" rx="10" fill="#17172b" stroke="#282840" stroke-width="1" />
      <text x="25" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#818CF8">VIRTUAL KEYBOARD GUIDANCE ACTIVE</text>
      
      <!-- Key rows simplified -->
      <g transform="translate(25, 38)">
        <rect x="0" y="0" width="36" height="34" rx="6" fill="#202038" stroke="#333355" />
        <text x="18" y="22" font-family="'Space Grotesk', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">Q</text>
        
        <rect x="42" y="0" width="36" height="34" rx="6" fill="#202038" stroke="#333355" />
        <text x="60" y="22" font-family="'Space Grotesk', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">W</text>
        
        <rect x="84" y="0" width="36" height="34" rx="6" fill="#8B5CF6" stroke="#A78BFA" stroke-width="1.5" />
        <text x="102" y="22" font-family="'Space Grotesk', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
        
        <rect x="126" y="0" width="36" height="34" rx="6" fill="#202038" stroke="#333355" />
        <text x="144" y="22" font-family="'Space Grotesk', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">R</text>

        <rect x="168" y="0" width="36" height="34" rx="6" fill="#202038" stroke="#333355" />
        <text x="186" y="22" font-family="'Space Grotesk', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">T</text>

        <rect x="210" y="0" width="36" height="34" rx="6" fill="#202038" stroke="#333355" />
        <text x="228" y="22" font-family="'Space Grotesk', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">Y</text>

        <!-- Spacebar key -->
        <rect x="260" y="0" width="220" height="34" rx="6" fill="#242442" stroke="#3b3b64" />
        <text x="370" y="22" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">SPACEBAR</text>

        <!-- React Badge -->
        <rect x="500" y="2" width="88" height="30" rx="6" fill="#1e1e36" stroke="#38BDF8" stroke-width="1" />
        <text x="544" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">React 18</text>
      </g>
    </g>
  </g>
</svg>
